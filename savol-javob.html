<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef2ff;--muted:#a5b0d6;--line:rgba(255,255,255,.16);--glass:rgba(18,22,52,.55);--accent:#5eead4;--accent2:#a78bfa}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);line-height:1.6;background:#0a0d24;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17205a 0%,#0a0d24 60%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.o1{width:46vmax;height:46vmax;background:#7c3aed;left:-12vmax;top:-10vmax;animation:d1 22s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:#0d9488;right:-10vmax;top:20vh;animation:d2 26s ease-in-out infinite alternate}
.o3{width:34vmax;height:34vmax;background:#2563eb;left:20vw;bottom:-14vmax;animation:d3 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vw,-12vh) scale(.9)}}
@keyframes d3{to{transform:translate(12vw,-16vh) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.card{width:100%;max-width:640px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:36px 28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.question{font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(20px,4.5vw,28px);line-height:1.35;margin-bottom:28px}
textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:120px;resize:vertical}
textarea::placeholder{color:#7e89b5}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{margin-top:14px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 28px;cursor:pointer;color:#0a0d24;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.msg{margin-top:14px;color:var(--accent);font-weight:700;min-height:24px;opacity:0;transition:opacity .3s}
.msg.show{opacity:1}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<main class="card">
  <h1 class="question">Hop sani chundim mayli ertaga br marta korishelk bosh og'riq bolmedi hech qanaqa voqtn bosa yozvor!</h1>
  <textarea id="answer" placeholder="Javobingizni yozing..."></textarea>
  <button class="btn" id="send">Javobni yuborish</button>
  <div class="msg" id="msg">Yuborildi ✓</div>
</main>

<script>
const KEY = 'savol-javob-answers-v2';
const box = document.getElementById('answer');
const msg = document.getElementById('msg');

document.getElementById('send').onclick = () => {
  const text = box.value.trim();
  if (!text) { box.focus(); return; }
  let list = [];
  try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  list.push({ text, time: Date.now() });
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  box.value = '';
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
};
</script>
</body>
</html>
